name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "Using zip: $ZIP"
          unzip -q "$ZIP" -d proj
          D=$(dirname "$(find proj -name settings.gradle | head -n 1)")
          echo "Project dir: $D"
          echo "PROJ=$D" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: QARevise-APK, path: "**/app-debug.apk" }
